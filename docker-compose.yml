services:
  django:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    # working_dir: ./backend
    container_name: django_app
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - /.env
    volumes:
      - ./backend:/app
    command: gunicorn --workers=4 --bind=0.0.0.0:8000 config.wsgi:application
    depends_on:
      - minio
      - db
    # networks:
    #   - app_network
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.develop
      # - DJANGO_SETTINGS_MODULE=config.settings.product

  db:
    image: postgres:latest
    container_name: django-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password_mycve
      POSTGRES_DB: django-db
    ports:
      - "2000:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    # networks:
    #   - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:latest
    container_name: nginx_proxy
    restart: always
    ports:
      - "80:80"
    depends_on:
      - django
    # networks:
    #   - app_network
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./backend/static:/app/static  # Statik dosyalar
      - ./backend/media:/app/media    # Medya dosyaları

  minio:
    image: minio/minio
    container_name: minio
    restart: always
    ports:
      - "9000:9000"  # S3 API erişimi
      - "9001:9001"  # MinIO Web UI
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_SERVER_URL: ${AWS_S3_ENDPOINT_URL}
    command: server --console-address ":9001" /data
    volumes:
      - minio_data:/data
    # networks:
    #   - app_network

  redis:
    image: redis:alpine
    ports:
      - 6379:6379

  celery:
    build: .
    user: django-user
    command: ["celery", "-A", "config", "worker", "--loglevel=info"]
    volumes:
      - .:/app
    depends_on:
      - redis

  celerybeat:
    build: .
    user: django-user
    command: ["celery", "-A", "config", "beat", "--loglevel=info", "--scheduler", "django_celery_beat.schedulers:DatabaseScheduler"]
    volumes:
      - .:/app
    depends_on:
      - redis
      
  nuxt:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
    container_name: nuxt_app
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - /.env
    volumes:
      - ./backend:/app

volumes:
  postgres_data:
  minio_data:

# networks:
#   app_network:
#     driver: bridge

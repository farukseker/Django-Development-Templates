services:
  django: &django
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    container_name: django_app
    restart: always
    ports:
      - "31:8000"
    env_file:
      - /.env
    volumes:
      - ./backend:/app
    command: gunicorn --workers=4 --bind=0.0.0.0:8000 config.wsgi:application
    depends_on:
      - minio
      - db
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.develop
      # - DJANGO_SETTINGS_MODULE=config.settings.product
    networks:
      - app_network
      
  db:
    image: postgres:latest
    container_name: django-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password_mycve
      POSTGRES_DB: django-db
    ports:
      - "2000:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:latest
    container_name: nginx_proxy
    restart: always
    ports:
      - "80:80"
    depends_on:
      - django
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./backend/static:/app/static  # Statik dosyalar
      - ./backend/media:/app/media    # Medya dosyaları
    networks:
      - app_network

  minio:
    image: minio/minio
    container_name: minio
    restart: always
    ports:
      - "9000:9000"  # S3 API erişimi
      - "9001:9001"  # MinIO Web UI
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_SERVER_URL: ${AWS_S3_ENDPOINT_URL}
    command: server --console-address ":9001" /data
    volumes:
      - minio_data:/data
    networks:
      - app_network

  redis:
    image: redis:alpine
    ports:
      - 2001:6379
    networks:
      - app_network

  celery_worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: celery_worker
    restart: always
    depends_on:
      - django
      - redis
    command: celery -A config.celery worker --loglevel=info
    env_file:
      - .env
    volumes:
      - ./backend:/app
    networks:
      - app_network

  celery_beat:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: celery_beat
    restart: always
    depends_on:
      - django
      - redis
      - celery_worker
    command: celery -A config.celery beat --loglevel=info
    env_file:
      - .env
    volumes:
      - ./backend:/app
    networks:
      - app_network

  nuxt:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
    container_name: nuxt_app
    restart: always
    ports:
      - "1000:3000"
    env_file:
      - /.env
    volumes:
      - ./backend:/app
    networks:
      - app_network

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.5
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
    volumes:
      - elastic_data:/usr/share/elasticsearch/data
    networks:
      - app_network
    ports:
      - 2002:9200/tcp

volumes:
  postgres_data:
  minio_data:
  mongo_data:
  elastic_data:
  graylog_data:
  
networks:
  app_network:
    driver: bridge
